upstream backend_api {
    server server:3000;
    keepalive 32;
}

upstream admin_frontend {
    server admin:80;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Maximum payload size for photo uploads (student selfies / reference enrollment)
    client_max_body_size 10M;

    # Gateway Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME challenge for Let's Encrypt / Certbot SSL renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API endpoints & health checks routed to backend server
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://backend_api/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend Single Page Application routed to Admin container
    location / {
        proxy_pass http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
